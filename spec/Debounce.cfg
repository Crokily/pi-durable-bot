\* The defaults of bot.json: 3 seconds after the last event, at most 20 seconds after the first. Twelve events in one
\* place, a second or two apart, keep a group waiting until the 20-second limit ends it.
CONSTANTS
    Places = {p1}
    Quiet = 3
    Max = 20
    MaxEvents = 12
    LastArrival = 24

SPECIFICATION Spec

INVARIANTS
    WaitLimits
    WakeTiming
    GroupsInOrder
    EveryEventOnce

PROPERTIES
    AllDecided

CHECK_DEADLOCK FALSE
