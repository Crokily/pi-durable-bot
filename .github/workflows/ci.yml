# Type check and all tests on Linux, macOS and Windows for every pull request, and the package installed and run as a
# person gets it. Releases run the tests again (release.yml).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

  # The packed package, installed globally without our lockfile, a bot made with pots init and a fake model, the gateway
  # as a background service, one message and its answer, and the service removed: scripts/install-test.ts.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A runner has no login session, so no systemd user manager. Lingering starts one, as a login does.
      - name: "Linux: a systemd user manager for the runner's user"
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 50); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Install, run as a service, talk to the bot, uninstall
        run: node scripts/install-test.ts

      - name: "Linux: the same with a system service"
        if: runner.os == 'Linux'
        run: node scripts/install-test.ts --system
