# pi-durable-bot · Slack app manifest
# Use: api.slack.com/apps, Create New App, From an app manifest, pick the workspace, paste this file.
# Based on the manifest recommended in the Vercel Chat SDK Slack adapter README, changed to socket mode, with DM and file scopes added.
# Change the name to your coworker's name before you paste it.
# This file holds no tokens. Never put tokens in this repository.
display_information:
  name: Pots
  description: A coworker on your team
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: pots
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - member_joined_channel
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
