# Publish to npm when a version tag (v1.2.3) is pushed. npm trusted publishing: npm checks this workflow's
# GitHub identity, so the repository holds no npm token and a release needs no 2FA. Provenance comes with it.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.0"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm with trusted publishing
        run: npm install --global 'npm@^11.5.1'

      - run: npm ci

      - run: npm run check

      - run: npm test

      - name: The tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$RELEASE_TAG" ] || { echo "Tag $RELEASE_TAG, package.json $VERSION"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=${RELEASE_TAG#v}
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v; next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: Publish to npm
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
