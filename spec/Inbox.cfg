\* Two events are enough for every order: both in one wake, or the second one after the first is decided or while it
\* waits again after a crash. Three events give more than 14 million states.
CONSTANTS
    Events = {e1, e2}
    Reasons = {mention, steer}
    MaxRepeats = 1
    MaxCrashes = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    StoredBeforeAck
    LoggedOnce
    DecidedAreLogged
    WokenOnce

PROPERTIES
    NothingLost

CHECK_DEADLOCK FALSE
